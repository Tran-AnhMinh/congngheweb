<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng - React CRUD</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Thư viện React, ReactDOM và Babel qua CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Component tìm kiếm người dùng
    function SearchForm({ onChangeValue }) {
      return (
        <div className="search-box">
          <input
            type="text"
            className="search-input"
            placeholder="Tìm theo name, username..."
            onChange={(e) => onChangeValue(e.target.value)}
          />
        </div>
      );
    }

    // Component thêm người dùng mới
    function AddUser({ onAdd }) {
      const initialUser = {
        name: "",
        username: "",
        email: "",
        address: { street: "", suite: "", city: "" },
        phone: "",
        website: ""
      };

      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState(initialUser);

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (["street", "suite", "city"].includes(id)) {
          setUser({ ...user, address: { ...user.address, [id]: value } });
        } else {
          setUser({ ...user, [id]: value });
        }
      };

      const handleAdd = () => {
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd(user);
        setUser(initialUser);
        setAdding(false);
      };

      const handleCancel = () => {
        setUser(initialUser);
        setAdding(false);
      };

      return (
        <div className="add-user-wrapper">
          <button className="btn btn-primary" onClick={() => setAdding(true)}>
            + Thêm người dùng
          </button>

          {adding && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Thêm người dùng</h4>

                <div className="form-group">
                  <label htmlFor="name">Name:</label>
                  <input id="name" type="text" value={user.name} onChange={handleChange} />
                </div>

                <div className="form-group">
                  <label htmlFor="username">Username:</label>
                  <input id="username" type="text" value={user.username} onChange={handleChange} />
                </div>

                <div className="form-group">
                  <label htmlFor="email">Email:</label>
                  <input id="email" type="email" value={user.email} onChange={handleChange} />
                </div>

                <div className="form-group">
                  <label htmlFor="street">Street:</label>
                  <input id="street" type="text" value={user.address.street} onChange={handleChange} />
                </div>

                <div className="form-group">
                  <label htmlFor="suite">Suite:</label>
                  <input id="suite" type="text" value={user.address.suite} onChange={handleChange} />
                </div>

                <div className="form-group">
                  <label htmlFor="city">City:</label>
                  <input id="city" type="text" value={user.address.city} onChange={handleChange} />
                </div>

                <div className="form-group">
                  <label htmlFor="phone">Phone:</label>
                  <input id="phone" type="text" value={user.phone} onChange={handleChange} />
                </div>

                <div className="form-group">
                  <label htmlFor="website">Website:</label>
                  <input id="website" type="text" value={user.website} onChange={handleChange} />
                </div>

                <div className="modal-actions">
                  <button className="btn btn-primary" onClick={handleAdd}>Thêm</button>
                  <button className="btn btn-secondary" onClick={handleCancel}>Hủy</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Component hiển thị, lọc, sửa, xóa danh sách người dùng
    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [editing, setEditing] = React.useState(null);

      // Tải dữ liệu 1 lần khi component mount
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            if (!res.ok) throw new Error("Không thể tải dữ liệu từ API");
            return res.json();
          })
          .then((data) => {
            setUsers(data);
            setLoading(false);
          })
          .catch((err) => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      // Lắng nghe prop user mới từ App để thêm vào danh sách
      React.useEffect(() => {
        if (user) {
          setUsers((prev) => {
            const nextId = prev.length > 0 ? Math.max(...prev.map((u) => u.id)) + 1 : 1;
            return [...prev, { ...user, id: nextId }];
          });
          onAdded();
        }
      }, [user, onAdded]);

      // Lọc danh sách theo keyword (không phân biệt hoa thường)
      const filteredUsers = users.filter(
        (u) =>
          u.name.toLowerCase().includes(keyword.toLowerCase()) ||
          u.username.toLowerCase().includes(keyword.toLowerCase())
      );

      // Deep copy đối tượng user và address sang state editing
      function editUser(u) {
        setEditing({ ...u, address: { ...u.address } });
      }

      // Cập nhật giá trị khi chỉnh sửa trên form
      function handleEditChange(field, value) {
        if (["street", "suite", "city"].includes(field)) {
          setEditing((prev) => ({
            ...prev,
            address: { ...prev.address, [field]: value }
          }));
        } else {
          setEditing((prev) => ({ ...prev, [field]: value }));
        }
      }

      // Lưu sau khi chỉnh sửa
      function saveUser() {
        if (editing.name.trim() === "" || editing.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        setEditing(null);
      }

      // Xóa người dùng khỏi danh sách
      function removeUser(id) {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      if (loading) {
        return <p className="status-message">Đang tải danh sách người dùng...</p>;
      }

      if (error) {
        return <p className="status-message error">Lỗi: {error}</p>;
      }

      return (
        <div className="table-container">
          <table className="user-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Username</th>
                <th>Email</th>
                <th>Địa chỉ</th>
                <th>Số điện thoại</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              {filteredUsers.length === 0 ? (
                <tr>
                  <td colSpan="7" className="empty-row">
                    Không tìm thấy người dùng phù hợp.
                  </td>
                </tr>
              ) : (
                filteredUsers.map((u) => (
                  <tr key={u.id}>
                    <td>{u.id}</td>
                    <td>{u.name}</td>
                    <td>{u.username}</td>
                    <td>{u.email}</td>
                    <td>
                      {[u.address?.street, u.address?.suite, u.address?.city]
                        .filter(Boolean)
                        .join(", ")}
                    </td>
                    <td>{u.phone}</td>
                    <td className="action-cell">
                      <button className="btn btn-edit" onClick={() => editUser(u)}>
                        Sửa
                      </button>
                      <button className="btn btn-delete" onClick={() => removeUser(u.id)}>
                        Xóa
                      </button>
                    </td>
                  </tr>
                ))
              )}
            </tbody>
          </table>

          {editing && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Sửa người dùng (ID: {editing.id})</h4>

                <div className="form-group">
                  <label htmlFor="edit-name">Name:</label>
                  <input
                    id="edit-name"
                    type="text"
                    value={editing.name}
                    onChange={(e) => handleEditChange("name", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-username">Username:</label>
                  <input
                    id="edit-username"
                    type="text"
                    value={editing.username}
                    onChange={(e) => handleEditChange("username", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-email">Email:</label>
                  <input
                    id="edit-email"
                    type="email"
                    value={editing.email}
                    onChange={(e) => handleEditChange("email", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-street">Street:</label>
                  <input
                    id="edit-street"
                    type="text"
                    value={editing.address.street}
                    onChange={(e) => handleEditChange("street", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-suite">Suite:</label>
                  <input
                    id="edit-suite"
                    type="text"
                    value={editing.address.suite}
                    onChange={(e) => handleEditChange("suite", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-city">City:</label>
                  <input
                    id="edit-city"
                    type="text"
                    value={editing.address.city}
                    onChange={(e) => handleEditChange("city", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-phone">Phone:</label>
                  <input
                    id="edit-phone"
                    type="text"
                    value={editing.phone}
                    onChange={(e) => handleEditChange("phone", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-website">Website:</label>
                  <input
                    id="edit-website"
                    type="text"
                    value={editing.website || ""}
                    onChange={(e) => handleEditChange("website", e.target.value)}
                  />
                </div>

                <div className="modal-actions">
                  <button className="btn btn-primary" onClick={saveUser}>Lưu</button>
                  <button className="btn btn-secondary" onClick={() => setEditing(null)}>Hủy</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Component gốc App quản lý state tập trung
    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);

      const handleAdded = React.useCallback(() => {
        setNewUser(null);
      }, []);

      return (
        <div className="app-container">
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable
            keyword={kw}
            user={newUser}
            onAdded={handleAdded}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
